body{

/* ================= TOP HEADER ================= */

}

}

/* User ID */

  font-weight:bold;

  overflow:hidden;

/* Wallet Amount */

  padding:14px 18px;
  border-radius:35px;

}

/* Help */

.helpBox{
  position:absolute;
  right:25px;
  top:116px;
  color:white;
  text-align:center;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;

}

.helpIcon{

}


/* ================= MAIN ================= */

.main{
  padding:18px 14px 0;
}


/* ================= BANNER ================= */

.banner{

  border:4px solid #111;

  overflow:hidden;
  background:#fff;
  margin-bottom:25px;
}

.banner iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}


/* ================= SLOGAN ================= */

.slogan{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#e52b23;
  margin:8px 0 24px;
}

.slogan span{
  color:#d7a928;
}


/* ================= ACTION BUTTONS ================= */

.actionBar{
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding:0 5px 20px;
  gap:8px;
}

.actionBtn{
  width:25%;
  background:transparent;
  border:0;
  color:#222;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  padding:0;
}

.actionIcon{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  background:#fff;
}

.actionText{
  margin-top:8px;
  font-size:17px;
  white-space:nowrap;
}


/* ================= GAME BOX ================= */

.container{
  display:block;
  width:100%;
  padding:0;
}

.btn{
  width:100%;
  background:#11151e;
  border-radius:25px;
  padding:28px 25px 22px;
  margin-bottom:18px;
  text-align:center;
  color:white;
  box-shadow:0 5px 12px rgba(0,0,0,.18);
  border:none;
  overflow:hidden;
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.gameTimeLabel{
  color:#cfcfcf;
  font-size:18px;
}

.gameTimeLabel span{
  color:#e0b52f;
  font-weight:bold;
}

.gameName{
  background:linear-gradient(90deg,#111,#222,#111);
  border:1px solid #303030;
  border-radius:35px;
  padding:14px 10px;
  font-size:21px;
  font-weight:bold;
  color:white;
  margin-bottom:22px;
}

.gameNumberRow{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
}

.numberBox{
  width:126px;
  height:116px;
  background:#171c26;
  border:1px solid #292e38;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.gameNumber{
  font-size:34px;
  color:#f0cf55;
  font-weight:bold;
}

.numberLabel{
  font-size:16px;
  color:#aaa;
  margin-top:6px;
}

.arrow{
  font-size:35px;
  color:#777;
}

.statusBox{
  width:100%;
  margin-top:25px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(90deg,#ffe48a,#a97d17);
  color:#111;
  font-size:23px;
  font-weight:bold;
}


/* ================= WHATSAPP ================= */

.whatsapp{
  position:fixed;
  right:18px;
  bottom:95px;
  width:58px;
  height:58px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:30px;
  text-decoration:none;
  z-index:500;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}


/* ================= BOTTOM NAV ================= */

#bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:82px;
  background:#0b0b0b;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
  padding:5px 3px;
}

.navBtn{
  width:19%;
  height:70px;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
  text-align:center;
}

.navIcon{
  font-size:29px;
  margin-bottom:5px;
}

.navText{
  font-size:15px;
}

.navBtn.active{
  background:#171717;
  box-shadow:0 0 18px rgba(220,170,45,.45);
  color:white;
}


/* ================= MOBILE ================= */

@media(max-width:420px){

    height:188px;

  }

  #userId{
    left:18px;

    max-width:125px;
    padding:14px 10px;
    font-size:15px;
  }

  #wallet{
    left:50%;
    transform:translateX(-50%);
    top:73px;

    padding:14px 15px;
    font-size:18px;
  }

  .helpBox{

    top:118px;
    font-size:17px;
  }

  .helpIcon{
    font-size:29px;
  }

  .banner{
    height:238px;
  }

  .slogan{
    font-size:23px;
  }

    width:65px;

    font-size:41px;
  }

  .actionText{

  }

  .btn{
    padding:27px 24px 21px;
  }

  .gameTimeLabel{
    font-size:17px;
  }

  .gameName{

  }

  .numberBox{
    width:126px;

  }
}


/* ================= SMALL PHONES ================= */

@media(max-width:360px){

  #userId{
    left:10px;
    min-width:95px;
    max-width:105px;
    font-size:13px;
    padding:13px 8px;
  }

  #wallet{
    min-width:115px;
    font-size:16px;
    padding:13px 10px;
  }

  .helpBox{
    right:10px;
    font-size:15px;
  }

  .helpIcon{
    font-size:27px;
  }

  .banner{
    height:205px;
  }

  }

  .actionIcon{
    width:57px;

  }

  .actionText{
    font-size:13px;
  }

  .numberBox{
    width:110px;
    height:105px;
  }

  .gameNumber{
    font-size:30px;
  }

}

</style>

<script>

/* ================= USER ================= */

const user =
  JSON.parse(localStorage.getItem("user"));

if(!user){

  window.location.href =
    "index.html";

}



/* ================= SUPABASE ================= */

const client =
  supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

  );



/* ================= WALLET ================= */

async function loadWallet(){

  const { data } = await client

    .from("login")

    .select("balance")

    .eq("id", user.id)

    .single();


  if(data){

    /* USER ID */

    document.getElementById("userId").innerText =
      "ID: " + user.id;


    /* ACTUAL BALANCE */

    document.getElementById("wallet").innerText =
      "💰 ₹" + data.balance;

  }

}



/* ================= GAME STATUS ================= */

function checkStatus(openTime, closeTime){

  if(!openTime || !closeTime)
    return false;


  let now =
    new Date();


  const [oh, om] =
    openTime.split(":");


  const [ch, cm] =
    closeTime.split(":");


  let open =
    new Date();

  open.setHours(
    oh,
    om,
    0
  );


  let close =
    new Date();

  close.setHours(
    ch,
    cm,
    0
  );


  if(close < open){

    close.setDate(
      close.getDate() + 1
    );


    if(now < open){

      now.setDate(
        now.getDate() + 1
      );

    }

  }


  return (
    now >= open &&
    now <= close
  );

}



/* ================= LOAD GAMES ================= */

async function loadButtons(){

  let { data } = await client

    .from("Game result")

    .select(
      "name, number, open, close"
    );


  if(!data)
    return;


  data.sort((a,b)=>{

    return (

      checkStatus(
        b.open,
        b.close
      )

      -

      checkStatus(
        a.open,
        a.close
      )

    );

  });



  let container =
    document.getElementById(
      "container"
    );


  container.innerHTML = "";



  data.forEach(item => {


    let isOpen =
      checkStatus(
        item.open,
        item.close
      );



    let btn =
      document.createElement(
        "div"
      );


    btn.className =
      "btn";



    btn.innerHTML = `

      <div class="gameTop">

        <div class="gameTimeLabel">

          OPEN:

          <span>
            ${item.open}
          </span>

        </div>


        <div class="gameTimeLabel">

          CLOSE:

          <span>
            ${item.close}
          </span>

        </div>

      </div>



      <div class="gameName">

        ${item.name}

        ${isOpen ? " 🔥" : ""}

      </div>



      <div class="gameNumberRow">


        <div class="numberBox">

          <div class="gameNumber">

            ${item.number || "**"}

          </div>

          <div class="numberLabel">

            कल

          </div>

        </div>



        <div class="arrow">

          ›

        </div>



        <div class="numberBox">

          <div class="gameNumber">

            XX

          </div>

          <div class="numberLabel">

            आज

          </div>

        </div>


      </div>



      <div class="statusBox">

        ${
          isOpen
          ? "खेलें"
          : "बंद"
        }

      </div>

    `;



    if(isOpen){

      btn.onclick = () => {

        localStorage.setItem(
          "market",
          item.name
        );


        window.location.href =
          "game.html";

      };

    }

    else{

      btn.style.opacity =
        "0.72";

    }



    container.appendChild(
      btn
    );

  });

}



/* ================= NAVIGATION ================= */

function go(page){

  window.location.href =
    page;

}



/* ================= SHARE ================= */

function shareApp(){

  if(navigator.share){

    navigator.share({

      title:"My App",

      text:"Join now",

      url:window.location.href

    });

  }

}



/* ================= WALLET PAGE ================= */

function goWallet(){

  window.location.href =
    "wallet.html";

}



/* ================= LOGOUT ================= */

function logout(){

  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}



/* ================= START ================= */

loadWallet();

loadButtons();



/* ================= AUTO REFRESH ================= */

setInterval(()=>{

  loadButtons();

  loadWallet();

},60000);

</script>
